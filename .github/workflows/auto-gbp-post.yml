name: Auto-Post to Google Business Profile

# GBP posting moved to the Cloudflare worker (watts-ai-proxy, cron 0 16 * * 1,3,5).
# This workflow remains as a MANUAL fallback only — run it via workflow_dispatch
# if the worker is ever down. Do not re-enable the schedule while the worker posts.

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write

jobs:
  post-to-gbp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and post GBP update
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
        run: node tools/gbp-auto-poster.js

      - name: Commit post log
        if: always()
        run: |
          git config user.name "Watts AI Content Bot"
          git config user.email "bot@wattsatpcontractor.com"
          if [ -f tools/gbp-post-log.txt ]; then
            git add tools/gbp-post-log.txt
            if ! git diff --staged --quiet; then
              git commit -m "GBP auto-post log update [skip ci]"
              git push
            fi
          fi

      - name: Ping search engines (sitemap update)
        run: node tools/ping-indexnow.js

      - name: Show result
        if: always()
        run: |
          if [ -f tools/gbp-post-log.txt ]; then
            head -20 tools/gbp-post-log.txt
          fi
